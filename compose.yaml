name: nlam-dss-26016

services:

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - nlam_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      LAND_RECORDS_API_URL: ${LAND_RECORDS_API_URL:-}
      LAND_RECORDS_API_TOKEN: ${LAND_RECORDS_API_TOKEN:-}

    ports:
      - "127.0.0.1:8002:8000"

    volumes:
      - ./backend/app:/app/app
      - nlam_documents_data:/app/uploads

    depends_on:
      db:
        condition: service_healthy

volumes:
  nlam_postgres_data:
  nlam_documents_data:
